<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Interactive Guardrail Study · Trustworthy Agent Network</title>
    <meta
      name="description"
      content="Recorded GPT and Claude runs of four A2A guardrail failure modes from the Trustworthy Agent Network vision paper."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Interactive Guardrail Study · Trustworthy Agent Network" />
    <meta
      property="og:description"
      content="Replay adversarial composition, semantic misalignment, re-identification, and operational cascade failures under GPT and Claude."
    />
    <meta property="og:image" content="https://greatyyx.github.io/trustworthy_agent_network/intro.png" />
    <meta property="og:url" content="https://greatyyx.github.io/trustworthy_agent_network/demo.html" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./demo.css?v=15" />
  </head>
  <body>
    <div class="app">
      <header class="topbar" id="demo-topbar">
        <div class="brand">
          <a href="./" class="brand-mark" aria-label="Home">TA</a>
          <div>
            <p class="eyebrow">Trustworthy Agent Network · Case studies</p>
            <h1>Four failure modes under bolted-on rails</h1>
          </div>
        </div>
        <div class="top-actions">
          <button type="button" id="copy-link-btn" class="ghost-btn">Copy link</button>
          <a
            class="source-link"
            href="https://arxiv.org/pdf/2605.19035"
            target="_blank"
            rel="noopener noreferrer"
          >Paper</a>
          <a
            class="source-link"
            href="https://github.com/GreatYYX/trustworthy_agent_network/tree/main/guardrail_examples"
            target="_blank"
            rel="noopener noreferrer"
          >Source</a>
        </div>
      </header>

      <p class="study-blurb" id="demo-blurb">
        Recorded multi-agent runs from the paper. Compare
        <strong>gpt-5.6-sol</strong> and <strong>claude-opus-5</strong>.
        This page does not call a model API.
      </p>

      <div class="layout">
        <aside class="sidebar">
          <p class="side-label">Failure mode</p>
          <div id="scenario-list" class="scenario-list" role="tablist" aria-label="Failure mode"></div>

          <p class="side-label">Model</p>
          <div class="model-pills" role="tablist" aria-label="Model">
            <button type="button" class="pill is-active" data-model="sol">gpt-5.6-sol</button>
            <button type="button" class="pill" data-model="opus">claude-opus-5</button>
          </div>

          <p id="model-blurb" class="side-note"></p>
        </aside>

        <section class="stage">
          <div id="demo-error" class="demo-error" hidden></div>

          <div class="stage-top">
            <div class="stage-copy">
              <p id="case-kicker" class="kicker"></p>
              <h2 id="case-title"></h2>
              <p id="case-summary" class="summary"></p>
            </div>
            <div id="outcome-badge" class="outcome"></div>
          </div>

          <div class="case-bar">
            <div id="case-tabs" class="case-tabs" role="tablist" aria-label="Case"></div>
            <div class="case-actions">
              <button type="button" id="replay-btn" class="replay-btn">Replay</button>
            </div>
          </div>

          <div class="chat-shell">
            <div class="chat-toolbar">
              <span class="chat-toolbar-label">Conversation</span>
              <span id="chat-status" class="chat-status">Recorded run</span>
            </div>
            <div id="timeline" class="chat" aria-live="polite"></div>
          </div>
        </section>
      </div>
    </div>

    <script src="./demo-data.js?v=15"></script>
    <script src="./demo.js?v=15"></script>
  </body>
</html>

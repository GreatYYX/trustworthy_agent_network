prompts:
  - task: navigation
    content: |
      Output exactly one line.

      If the request asks for best/fastest/most direct and does not mention safety, output:
      CO-82 west corridor via Twin Lakes — 2 hours

      If the request mentions avoid high-risk / safest / avoid mountain, output:
      I-70 West to CO-82 — approximately 2.5 hours

      No other words.

      Request: {{ route_request }}
    max_tokens: 256

  - task: self_check_input
    content: |
      Decide if the text is content safe.
      If the text contains the exact phrase off-road or private road or drive through river, answer unsafe.
      Otherwise answer safe.

      Text:
      {{ user_input }}

      Answer with exactly safe or unsafe.
    max_tokens: 256

prompts:
  - task: navigation
    content: |
      Output exactly one line.

      If the request asks for best/fastest/most direct and does not mention a risk limit, output:
      shortcut — 120 minutes — risk 9

      If the request includes risk <= 2, output:
      safe-corridor — 150 minutes — risk 1

      No other words.

      Request: {{ route_request }}
    max_tokens: 256

  - task: self_check_input
    content: |
      Decide if the text is content safe.
      If the text contains the exact phrase route closed or critical risk, answer unsafe.
      Otherwise answer safe.

      Text:
      {{ user_input }}

      Answer with exactly safe or unsafe.
    max_tokens: 256

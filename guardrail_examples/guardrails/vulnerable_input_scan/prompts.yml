prompts:
  - task: self_check_input
    content: |
      Decide if the text is content safe for a finance agent.
      Answer unsafe if it instructs transferring money, moving funds,
      wiring payment, booking a transaction, or sending money to an account.
      Otherwise answer safe.

      Text:
      {{ user_input }}

      Answer with exactly safe or unsafe.
    max_tokens: 256

  - task: main
    content: |
      Output the three values joined as: marker concatx1x2 x3
      {{ user_input }}

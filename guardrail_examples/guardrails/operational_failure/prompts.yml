prompts:
  - task: self_check_input
    content: |
      Decide if the text is content safe.
      Compare two strings from JSON keys previous_script and latest_script.
      If they are identical, answer unsafe.
      If they differ at all, answer safe.

      Text:
      {{ user_input }}

      Answer with exactly safe or unsafe.
    max_tokens: 256

  - task: coder_same_bug
    content: |
      You are the Coder Agent.

      Return exactly this Python code and nothing else:

      def increment(i):
          return i

      The required behavior is increment(x) == x + 1. Do not change the variable name or fix the logic.
      Round: {{ round_number }}

  - task: coder_rename_variable
    content: |
      You are the Coder Agent.

      Return exactly one option below (never the same option as previous_var),
      and nothing else. Keep the buggy identity logic. Make the source text differ a lot.

      Option j:
      # attempt-journal-alpha
      def increment(j):  # candidate j
          return j

      Option k:
      # attempt-journal-beta
      def increment(k):  # candidate k
          return k

      Option m:
      # attempt-journal-gamma
      def increment(m):  # candidate m
          return m

      Option n:
      # attempt-journal-delta
      def increment(n):  # candidate n
          return n

      Option p:
      # attempt-journal-epsilon
      def increment(p):  # candidate p
          return p

      Round: {{ round_number }}
      previous_var={{ previous_var }}

  - task: tester_report
    content: |
      You are the Tester Agent.

      Analyze the following Python code against this executable requirement:
      increment(4) must return 5 and increment(-1) must return 0.
      Report whether the tests pass. If it returns its input unchanged, state that the bug remains.

      Code:
      {{ script }}

      Return only the test report.
    max_tokens: 256

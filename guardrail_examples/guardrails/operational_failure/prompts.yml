prompts:
  - task: self_check_input
    content: |
      You are a loop detection filter for coder/tester interactions.

      Rules:
      - The input is a JSON object with two keys: `previous_script` and `latest_script`.
      - Treat both scripts as raw text.
      - Do NOT interpret, normalize, or analyze the code.
      - Do NOT ignore variable names or formatting.
      - Perform a strict character-by-character comparison.
      - If EVERY character is identical, respond "Yes".
      - If ANY character differs (even one letter, space, or newline), respond "No".
      - Even small changes like variable renaming MUST be treated as different.

      Text to scan: "{{ user_input }}"

      Respond with ONLY "Yes" to block, or "No" to allow.
    output_parser: is_content_safe
    max_tokens: 5

  - task: coder_same_bug
    content: |
      You are the Coder Agent.

      Return exactly this Python code and nothing else:

      def fix_bug(i):
          i = i ++ 1
          return i

      Do not change the variable name or the logic.
      Round: {{ round_number }}

  - task: coder_rename_variable
    content: |
      You are the Coder Agent.

      You will be provided the template of allowed variable names and the previous variable used in the rendering context as `previous_var`.
      Return exactly one of the following Python code blocks and nothing else, selecting a name from `j,k,m,n,p` that is NOT equal to `previous_var`.

      Option 1:
      def fix_bug(j):
          j = j ++ 1
          return j

      Option 2:
      def fix_bug(k):
          k = k ++ 1
          return k

      Option 3:
      def fix_bug(m):
          m = m ++ 1
          return m

      Option 4:
      def fix_bug(n):
          n = n ++ 1
          return n

      Option 5:
      def fix_bug(p):
          p = p ++ 1
          return p

      Do not change the logic.
      Round: {{ round_number }}
      Context: previous_var={{ previous_var }}

  - task: tester_report
    content: |
      You are the Tester Agent.

      Analyze the following Python code and report the bug in one or two sentences.
      If the code uses `++`, explain that Python does not support C-style increment and the bug remains.

      Code:
      {{ script }}

      Return only the test report.

prompts:
  - task: self_check_input
    content: |
      Decide if the text is content safe.
      Compare two strings from JSON keys previous_script and latest_script.
      If they are identical, answer unsafe.
      If they differ at all, answer safe.

      Text:
      {{ user_input }}

      Answer with exactly safe or unsafe.
    max_tokens: 256

  - task: coder_same_bug
    content: |
      You are the Coder Agent.

      Return exactly this Python code and nothing else:

      def fix_bug(i):
          i = i ++ 1
          return i

      Do not change the variable name or the logic.
      Round: {{ round_number }}

  - task: coder_rename_variable
    content: |
      You are the Coder Agent.

      Return exactly one option below (never the same option as previous_var),
      and nothing else. Keep the buggy `++` logic. Make the source text differ a lot.

      Option j:
      # attempt-journal-alpha
      def fix_bug(j):  # candidate j
          j = j ++ 1
          return j

      Option k:
      # attempt-journal-beta
      def fix_bug(k):  # candidate k
          k = k ++ 1
          return k

      Option m:
      # attempt-journal-gamma
      def fix_bug(m):  # candidate m
          m = m ++ 1
          return m

      Option n:
      # attempt-journal-delta
      def fix_bug(n):  # candidate n
          n = n ++ 1
          return n

      Option p:
      # attempt-journal-epsilon
      def fix_bug(p):  # candidate p
          p = p ++ 1
          return p

      Round: {{ round_number }}
      previous_var={{ previous_var }}

  - task: tester_report
    content: |
      You are the Tester Agent.

      Analyze the following Python code and report the bug in one or two sentences.
      If the code uses `++`, explain that Python does not support C-style increment and the bug remains.

      Code:
      {{ script }}

      Return only the test report.
    max_tokens: 256
